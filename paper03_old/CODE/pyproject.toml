[build-system]
requires = ["setuptools>=45", "wheel", "setuptools_scm[toml]>=6.2"]
build-backend = "setuptools.build_meta"

[project]
name = "ctg-lc-experiments"
version = "1.0.0"
description = "Experimental framework for CTG-LC protocol evaluation"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "CTG-LC Research Team", email = "your-email@example.com"}
]
keywords = ["consensus", "byzantine", "multi-agent", "industrial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]

dependencies = [
    "numpy>=1.21.0,<2.0.0",
    "scipy>=1.7.0,<2.0.0",
    "pandas>=1.3.0,<2.0.0",
    "matplotlib>=3.4.0,<4.0.0",
    "seaborn>=0.11.0,<1.0.0",
    "PyYAML>=5.4.0,<7.0.0",
    "cryptography>=3.4.0,<42.0.0",
    "tqdm>=4.62.0,<5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.2.0,<8.0.0",
    "pytest-cov>=2.12.0,<5.0.0",
    "black>=21.6b0,<24.0.0",
    "flake8>=3.9.0,<7.0.0",
    "mypy>=0.910,<2.0.0",
]

jupyter = [
    "jupyter>=1.0.0,<2.0.0",
    "ipython>=7.0.0,<9.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/ctg-lc-experiments"
Documentation = "https://ctg-lc-experiments.readthedocs.io"
Repository = "https://github.com/yourusername/ctg-lc-experiments"
"Bug Tracker" = "https://github.com/yourusername/ctg-lc-experiments/issues"

[tool.black]
line-length = 100
target-version = ['py38', 'py39', 'py310']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q --strict-markers --cov=src --cov-report=term-missing"
testpaths = [
    "tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.mypy]
python_version = "3.8"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "matplotlib.*",
    "seaborn.*",
    "scipy.*",
]
ignore_missing_imports = true